name: Build USB0 Manager v2.1.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: usb0-manager-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_NDK_ARCHIVE: 'android-ndk-r27c-linux.zip'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            ca-certificates \
            unzip \
            tar \
            gzip \
            autoconf \
            automake \
            libtool \
            file

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDKROOT"
          test -d "$SDKROOT"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -1 || true)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"

      - name: Ensure Android SDK platform and build-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$SDKMANAGER"

          # Never ask sdkmanager to install the obsolete top-level 'tools' package.
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          if [ ! -d "$SDKROOT/platforms/android-${ANDROID_API_LEVEL}" ]; then
            echo "Installing platforms;android-${ANDROID_API_LEVEL}"
            "$SDKMANAGER" --install "platforms;android-${ANDROID_API_LEVEL}"
          fi

          if [ ! -x "$SDKROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" ]; then
            echo "Installing build-tools;${ANDROID_BUILD_TOOLS}"
            "$SDKMANAGER" --install "build-tools;${ANDROID_BUILD_TOOLS}"
          fi

          test -d "$SDKROOT/platforms/android-${ANDROID_API_LEVEL}"
          test -x "$SDKROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

      - name: Restore/cache direct-download NDK r27c
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/android-ndk-r27c
          key: android-ndk-r27c-${{ runner.os }}-${{ runner.arch }}

      - name: Install Android NDK r27c without sdkmanager
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          NDK_ZIP="$RUNNER_TEMP/${ANDROID_NDK_ARCHIVE}"
          NDK_DIR="$RUNNER_TEMP/android-ndk-r27c"
          URL="https://dl.google.com/android/repository/${ANDROID_NDK_ARCHIVE}"

          rm -rf "$NDK_DIR" "$NDK_ZIP"
          echo "Downloading $URL"

          curl --fail --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "$URL" -o "$NDK_ZIP"

          test -s "$NDK_ZIP"
          echo "Testing NDK archive"
          unzip -tq "$NDK_ZIP"

          echo "Extracting NDK"
          unzip -q "$NDK_ZIP" -d "$RUNNER_TEMP"

          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"

      - name: Export NDK environment
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$RUNNER_TEMP/android-ndk-r27c"
          CLANG_DIR="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$CLANG_DIR/aarch64-linux-android30-clang"
          test -x "$CLANG_DIR/llvm-strip"
          test -x "$CLANG_DIR/llvm-readelf"

          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDKROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$CLANG_DIR" >> "$GITHUB_PATH"

      - name: Prepare ARM64 asset directory
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a"
          mkdir -p "$OUT"
          rm -f "$OUT/pppd" "$OUT/chat" "$OUT/usb0-native"
          test -d "$OUT"

      - name: Build ARM64 usb0-native
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_ROOT"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a/usb0-native"

          "$BIN/aarch64-linux-android30-clang" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -pie \
            "$GITHUB_WORKSPACE/app/src/main/cpp/usb0-native.c" \
            -o "$OUT"

          "$BIN/llvm-strip" "$OUT" || true
          chmod 755 "$OUT"
          file "$OUT"
          "$BIN/llvm-readelf" -h "$OUT" | grep -E 'Class:|Machine:|Type:'

      - name: Install supplied ARM64 BusyBox
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 "$GITHUB_WORKSPACE/scripts/build-busybox.sh"
          "$GITHUB_WORKSPACE/scripts/build-busybox.sh"
          test -s "$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a/busybox"
          file "$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a/busybox"

      - name: Build PPP 2.5.4 for ARM64 Android
        shell: bash
        run: |
          set -u -o pipefail

          REPO="$GITHUB_WORKSPACE"
          OUT="$REPO/app/src/main/assets/tools/arm64-v8a"
          WORK="$RUNNER_TEMP/usb0-ppp-2.5.4"
          PPP_SRC="$WORK/ppp"

          mkdir -p "$OUT"
          rm -f "$OUT/pppd" "$OUT/chat"

          chmod 755 "$REPO/scripts/build-ppp.sh"

          echo '=== PPP BUILD START ==='
          bash "$REPO/scripts/build-ppp.sh" 2>&1 | tee "$RUNNER_TEMP/ppp-wrapper.log"
          RC=${PIPESTATUS[0]}

          if [ "$RC" -ne 0 ]; then
            echo '=== PPP SCRIPT FAILED ==='
            echo "exit=$RC"

            # The old PPP script could compile successfully and then fail while
            # copying to a relative app/... path after cd'ing into the temp tree.
            # Recover only if both real ARM64 binaries were actually produced.
            if [ -s "$PPP_SRC/pppd/pppd" ] && [ -s "$PPP_SRC/chat/chat" ]; then
              echo 'PPP binaries exist in the temporary source tree; recovering them using absolute paths.'
              cp -f "$PPP_SRC/pppd/pppd" "$OUT/pppd"
              cp -f "$PPP_SRC/chat/chat" "$OUT/chat"
              chmod 755 "$OUT/pppd" "$OUT/chat"
              echo 'PPP artifact recovery succeeded.'
              RC=0
            else
              echo 'PPP binaries were not produced; this is a real PPP build failure.'
            fi
          fi

          if [ "$RC" -ne 0 ]; then
            echo '=== PPP WRAPPER LOG (last 240 lines) ==='
            tail -240 "$RUNNER_TEMP/ppp-wrapper.log" || true
            exit "$RC"
          fi

          test -s "$OUT/pppd"
          test -s "$OUT/chat"
          file "$OUT/pppd"
          file "$OUT/chat"
          file "$OUT/pppd" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          file "$OUT/chat" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          echo '=== PPP BUILD SUCCESS ==='

      - name: Verify PPP Android patch and artifacts
        shell: bash
        run: |
          set -euo pipefail
          PPP_SRC="$RUNNER_TEMP/usb0-ppp-2.5.4/ppp"
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a"

          grep -F '!defined(_UAPI_LINUX_IN6_H)' "$PPP_SRC/pppd/sys-linux.c"
          grep -F '!defined(_UAPI_IPV6_H)' "$PPP_SRC/pppd/sys-linux.c"
          grep -F '!defined(__ANDROID__)' "$PPP_SRC/pppd/sys-linux.c"

          test -s "$OUT/pppd"
          test -s "$OUT/chat"

      - name: Verify all embedded tools
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a"

          for f in \
            usb0-helper \
            usb0-helper.sh \
            usb0-native \
            busybox \
            pppd \
            chat; do
            test -s "$OUT/$f"
            echo "OK: $OUT/$f"
          done

          for f in $(find "$GITHUB_WORKSPACE/scripts" "$GITHUB_WORKSPACE/app/src/main/assets" -type f -name '*.sh'); do
            bash -n "$f"
          done

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 "$GITHUB_WORKSPACE/gradlew"
          "$GITHUB_WORKSPACE/gradlew" --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/gradlew" assembleDebug --no-daemon --stacktrace --info

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB' \
            -noprompt

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/gradlew" assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit

      - name: Verify APKs and embedded ARM64 payloads
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$SDKROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          for apk in \
            "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk \
            "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "=== $apk ==="
            "$APKSIGNER" verify --verbose "$apk"
            unzip -tq "$apk"
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/busybox'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/usb0-native'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/pppd'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/chat'
          done

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/artifacts/"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v2.1.1
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v2.1.1-diagnostics
          path: |
            ${{ runner.temp }}/ppp-wrapper.log
            ${{ runner.temp }}/usb0-ppp-2.5.4/ppp/pppd/sys-linux.c
            ${{ runner.temp }}/usb0-ppp-2.5.4/ppp/ppp-build.log
            app/build/reports/**
            app/build/outputs/**
          if-no-files-found: ignore
          retention-days: 14
