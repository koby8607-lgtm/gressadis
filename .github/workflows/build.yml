name: Build USB0 Manager v2.0.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'
      ANDROID_NDK_ARCHIVE: 'android-ndk-r27c-linux.zip'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl ca-certificates tar gzip autoconf automake libtool

      - name: Install Android SDK components (no obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}"
          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API_LEVEL}"
          test -x "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

      - name: Install Android NDK r27c without sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [ -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" ]; then
            echo "Compatible NDK already present: $NDK_DIR"
          else
            tmp="$RUNNER_TEMP/${ANDROID_NDK_ARCHIVE}"
            curl --fail --location --retry 8 --retry-all-errors --retry-delay 3 "https://dl.google.com/android/repository/${ANDROID_NDK_ARCHIVE}" -o "$tmp"
            test -s "$tmp"
            unzip -tq "$tmp" >/dev/null
            rm -rf "$RUNNER_TEMP/ndk-extract" "$NDK_DIR"
            mkdir -p "$RUNNER_TEMP/ndk-extract" "$(dirname "$NDK_DIR")"
            unzip -q "$tmp" -d "$RUNNER_TEMP/ndk-extract"
            test -d "$RUNNER_TEMP/ndk-extract/android-ndk-r27c"
            mv "$RUNNER_TEMP/ndk-extract/android-ndk-r27c" "$NDK_DIR"
          fi
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          test -x ./gradlew
          bash ./gradlew --version

      - name: Build real ARM64 usb0-native executable
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_ROOT:-$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}}"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          "$CLANG" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -pie \
            app/src/main/cpp/usb0-native.c \
            -o app/src/main/assets/tools/arm64-v8a/usb0-native

          "$STRIP" app/src/main/assets/tools/arm64-v8a/usb0-native || true
          chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native
          file app/src/main/assets/tools/arm64-v8a/usb0-native
          "$READELF" -h app/src/main/assets/tools/arm64-v8a/usb0-native | grep -E 'Class:|Machine:|Type:'

      - name: Use prebuilt ARM64 BusyBox
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 scripts/build-busybox.sh
          ./scripts/build-busybox.sh

      - name: Build PPPD and chat for ARM64 Android
        shell: bash
        run: |
          set -uo pipefail
          chmod 755 scripts/build-ppp.sh
          set +e
          ./scripts/build-ppp.sh 2>&1 | tee "$RUNNER_TEMP/ppp-build.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "PPP build failed (rc=$rc); continuing with the core USB0/RNDIS APK."
            touch app/src/main/assets/tools/arm64-v8a/PPP_BUILD_FAILED
          fi

      - name: Verify private APK tools
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/tools/arm64-v8a/usb0-native
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper.sh
          test -s app/src/main/assets/tools/arm64-v8a/busybox
          test -s app/src/main/assets/tools/arm64-v8a/pppd
          test -s app/src/main/assets/tools/arm64-v8a/chat
          test -s app/src/main/assets/r36s/lineageos_r36s_defconfig.txt
          test -s app/src/main/assets/r36s/kernel-capabilities.txt
          file app/src/main/assets/tools/arm64-v8a/usb0-native
          file app/src/main/assets/tools/arm64-v8a/busybox

      - name: Create CI release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB" \
            -noprompt

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in $(find scripts app/src/main/assets -type f -name '*.sh'); do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit

      - name: Verify APK signatures and embedded ARM64 tools
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "Checking $apk"
            "$APKSIGNER" verify --verbose "$apk"
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/busybox'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/usb0-native'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/usb0-helper.sh'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/SHA256SUMS'
            if unzip -l "$apk" | grep -q 'assets/tools/arm64-v8a/pppd'; then
              unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/pppd'
              unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/chat'
              unzip -p "$apk" assets/tools/arm64-v8a/pppd | file -
              unzip -p "$apk" assets/tools/arm64-v8a/chat | file -
            else
              echo 'PPP binaries are not present in this build.'
            fi
            unzip -p "$apk" assets/tools/arm64-v8a/busybox | file -
            unzip -p "$apk" assets/tools/arm64-v8a/usb0-native | file -
          done

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/
          cp app/build/outputs/apk/release/*.apk artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v2.0.0
          path: artifacts/*.apk
          retention-days: 30

      - name: Publish release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v2.0.0-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            ~/.gradle/daemon/**
            $RUNNER_TEMP/ppp-build.log
          if-no-files-found: ignore
          retention-days: 7
