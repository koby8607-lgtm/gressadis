name: Build USB0 Manager v2.1.2 R36S

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: usb0-manager-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_NDK_ARCHIVE: 'android-ndk-r27c-linux.zip'
  PPP_VERSION: '2.5.4'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            curl \
            ca-certificates \
            unzip \
            tar \
            gzip \
            autoconf \
            automake \
            libtool \
            gettext \
            file

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDKROOT"
          test -d "$SDKROOT"
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "Using Android SDK at $SDKROOT"

      - name: Ensure Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for candidate in \
            "$SDKROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDKROOT/cmdline-tools/16.0/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | head -1 || true)"
          fi
          test -x "$SDKMANAGER"

          echo "Accepting Android SDK licenses"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          if [ ! -d "$SDKROOT/platforms/android-${ANDROID_API_LEVEL}" ]; then
            "$SDKMANAGER" "platforms;android-${ANDROID_API_LEVEL}"
          fi
          if [ ! -x "$SDKROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" ]; then
            "$SDKMANAGER" "build-tools;${ANDROID_BUILD_TOOLS}"
          fi

          test -d "$SDKROOT/platforms/android-${ANDROID_API_LEVEL}"
          test -x "$SDKROOT/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"

      - name: Download and validate Android NDK r27c
        shell: bash
        run: |
          set -euo pipefail
          NDK_ZIP="$RUNNER_TEMP/${ANDROID_NDK_ARCHIVE}"
          NDK_DIR="$RUNNER_TEMP/android-ndk-r27c"
          URL="https://dl.google.com/android/repository/${ANDROID_NDK_ARCHIVE}"

          rm -rf "$NDK_DIR" "$NDK_ZIP"
          echo "Downloading $URL"
          curl --fail --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "$URL" -o "$NDK_ZIP"

          test -s "$NDK_ZIP"
          echo "Validating ZIP"
          unzip -tq "$NDK_ZIP"

          echo "Extracting NDK"
          unzip -q "$NDK_ZIP" -d "$RUNNER_TEMP"

          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDKROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Prepare ARM64 asset directory
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a"
          mkdir -p "$OUT"
          rm -f "$OUT/usb0-native" "$OUT/pppd" "$OUT/chat"
          test -d "$OUT"

      - name: Build usb0-native for ARM64 Android API 30
        shell: bash
        run: |
          set -euo pipefail
          BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SRC="$GITHUB_WORKSPACE/app/src/main/cpp/usb0-native.c"
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a/usb0-native"

          "$BIN/aarch64-linux-android30-clang" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -pie \
            "$SRC" \
            -o "$OUT"

          "$BIN/llvm-strip" "$OUT" || true
          chmod 755 "$OUT"
          file "$OUT"
          "$BIN/llvm-readelf" -h "$OUT" | grep -E 'Class:|Machine:|Type:'

      - name: Verify supplied ARM64 BusyBox
        shell: bash
        run: |
          set -euo pipefail
          BUSYBOX="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a/busybox"
          test -s "$BUSYBOX"
          chmod 755 "$BUSYBOX"
          file "$BUSYBOX"
          file "$BUSYBOX" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          file "$BUSYBOX" | grep -Eiq 'statically linked'
          sha256sum "$BUSYBOX"
          echo "Using the supplied prebuilt ARM64 BusyBox; CI will never execute it."

      - name: Build PPP 2.5.4 and chat directly (bypass fragile project script)
        shell: bash
        run: |
          set -u -o pipefail

          REPO="$GITHUB_WORKSPACE"
          OUT="$REPO/app/src/main/assets/tools/arm64-v8a"
          WORK="$RUNNER_TEMP/usb0-ppp-${PPP_VERSION}"
          SRC="$WORK/ppp"
          LOG="$RUNNER_TEMP/ppp-build.log"
          NDK="$ANDROID_NDK_ROOT"
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          rm -rf "$WORK"
          mkdir -p "$WORK" "$OUT"
          rm -f "$OUT/pppd" "$OUT/chat"

          TARBALL="$WORK/ppp-${PPP_VERSION}.tar.gz"
          URL="https://github.com/ppp-project/ppp/archive/refs/tags/v${PPP_VERSION}.tar.gz"

          echo "Downloading official PPP ${PPP_VERSION} source"
          curl --fail --show-error --location \
            --retry 10 --retry-all-errors --retry-delay 3 \
            "$URL" -o "$TARBALL"
          test -s "$TARBALL"
          tar -tzf "$TARBALL" >/dev/null
          tar -xzf "$TARBALL" -C "$WORK"
          mv "$WORK/ppp-${PPP_VERSION}" "$SRC"
          cd "$SRC"

          echo "Applying Android/Bionic in6_ifreq compatibility patch"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pppd/sys-linux.c")
          text = path.read_text()
          marker = text.find("struct in6_ifreq")
          if marker < 0:
              raise SystemExit("struct in6_ifreq not found in pppd/sys-linux.c")

          start = max(0, marker - 1800)
          prefix = text[start:marker]
          match = re.search(r"#ifndef[ \t]+_LINUX_IN6_H", prefix)
          if not match:
              raise SystemExit("PPP fallback guard not found before struct in6_ifreq")

          old = match.group(0)
          new = "#if !defined(__ANDROID__) && !defined(_LINUX_IN6_H) && !defined(_UAPI_LINUX_IN6_H) && !defined(_UAPI_IPV6_H)"
          abspos = start + match.start()
          text = text[:abspos] + new + text[abspos + len(old):]
          path.write_text(text)
          print("Patched: ", old, "->", new, sep="")
          PY

          grep -F '!defined(__ANDROID__)' pppd/sys-linux.c
          grep -F '!defined(_UAPI_IPV6_H)' pppd/sys-linux.c

          if [ ! -x ./configure ]; then
            echo "configure missing; bootstrapping autotools"
            test -x ./autogen.sh
            ./autogen.sh
          fi
          test -x ./configure

          export CC="$BIN/aarch64-linux-android30-clang"
          export AR="$BIN/llvm-ar"
          export RANLIB="$BIN/llvm-ranlib"
          export CFLAGS="-O2 -fPIE -fstack-protector-strong -DANDROID -D__ANDROID_API__=30"
          export CPPFLAGS="$CFLAGS"
          export LDFLAGS="-pie"
          export LIBS=""

          echo "Configuring PPP"
          ./configure \
            --build="$(gcc -dumpmachine)" \
            --host=aarch64-linux-gnu \
            --prefix=/data/local/tmp/usb0-ppp \
            --sysconfdir=/data/local/tmp/usb0-ppp/etc \
            --disable-plugins \
            --disable-eaptls \
            --disable-peap \
            --disable-multilink \
            --disable-systemd \
            --without-openssl \
            --without-pam \
            --without-pcap \
            --without-atm

          echo "=== PPP BUILD START ==="
          make -j1 V=1 CFLAGS="$CFLAGS" CPPFLAGS="$CPPFLAGS" LDFLAGS="$LDFLAGS" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "=== PPP BUILD FAILURE ==="
            tail -300 "$LOG" || true
            exit "$rc"
          fi

          test -s "$SRC/pppd/pppd"
          test -s "$SRC/chat/chat"

          # IMPORTANT: copy from absolute source and absolute output paths.
          # This prevents the exact failure caused by a relative app/... path
          # after the build changes working directory.
          cp -f "$SRC/pppd/pppd" "$OUT/pppd"
          cp -f "$SRC/chat/chat" "$OUT/chat"
          chmod 755 "$OUT/pppd" "$OUT/chat"
          "$BIN/llvm-strip" "$OUT/pppd" || true
          "$BIN/llvm-strip" "$OUT/chat" || true

          file "$OUT/pppd"
          file "$OUT/chat"
          file "$OUT/pppd" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          file "$OUT/chat" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          echo "=== PPP BUILD SUCCESS ==="

      - name: Verify all bundled ARM64 tools
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/app/src/main/assets/tools/arm64-v8a"

          for f in busybox usb0-native pppd chat usb0-helper usb0-helper.sh; do
            test -s "$OUT/$f"
            echo "OK $f"
          done

          file "$OUT/busybox" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          file "$OUT/usb0-native" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          file "$OUT/pppd" | grep -Eiq 'ELF 64-bit.*ARM aarch64'
          file "$OUT/chat" | grep -Eiq 'ELF 64-bit.*ARM aarch64'

          find scripts app/src/main/assets -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: Prepare and validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          test -s ./gradlew
          bash ./gradlew --version

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Create temporary release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB' \
            -noprompt

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit

      - name: Verify APKs contain the required ARM64 payloads
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$SDKROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          for apk in \
            "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk \
            "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            echo "=== VERIFY $apk ==="
            "$APKSIGNER" verify --verbose "$apk"
            unzip -tq "$apk"
            for asset in \
              assets/tools/arm64-v8a/busybox \
              assets/tools/arm64-v8a/usb0-native \
              assets/tools/arm64-v8a/usb0-helper.sh \
              assets/tools/arm64-v8a/pppd \
              assets/tools/arm64-v8a/chat; do
              unzip -l "$apk" | grep -F "$asset"
            done
          done

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/artifacts/"
          cp "$GITHUB_WORKSPACE"/app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/artifacts/"
          ls -lh "$GITHUB_WORKSPACE/artifacts"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v2.1.2-r36s
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release APKs on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v2.1.2-diagnostics
          path: |
            ${{ runner.temp }}/ppp-build.log
            ${{ runner.temp }}/android-ndk-r27c
            app/build/reports/**
            app/build/outputs/**
          if-no-files-found: ignore
          retention-days: 14
